{% extends "base.html" %}

{% block title %}Iniciar Sesión{% endblock %}

{% block content %}
<div class="container-sm">
    <div class="flex-center" style="min-height: 100vh;">
        <div>
            <div class="text-center mb-lg">
                <h1 style="font-size: 3rem; margin-bottom: 0;">📝</h1>
                <h2>Notas App</h2>
                <p class="text-muted">Sistema de gestión de notas</p>
            </div>
            
            <div class="card">
                <div class="card-body">
                    <h3 class="text-center mb-lg">Iniciar Sesión</h3>
                    
                    {% if error %}
                    <div class="alert alert-danger">
                        <strong>Error:</strong> {{ error }}
                        <button class="alert-close" onclick="this.parentElement.remove()">×</button>
                    </div>
                    {% endif %}
                    
                    <form method="POST" action="{{ url_for('auth.login') }}">
                        <div class="form-group">
                            <label for="usuario">Usuario</label>
                            <input 
                                type="text" 
                                id="usuario" 
                                name="usuario" 
                                placeholder="Ingresa tu usuario"
                                required
                                autofocus
                            >
                        </div>
                        
                        <div class="form-group">
                            <label for="contraseña">Contraseña</label>
                            <input 
                                type="password" 
                                id="contraseña" 
                                name="contraseña" 
                                placeholder="Ingresa tu contraseña"
                                required
                            >
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-block">
                            Iniciar Sesión
                        </button>
                    </form>
                    
                    <hr style="margin: var(--spacing-lg) 0; border: none; border-top: 1px solid var(--border-color);">
                    
                    <p class="text-center">
                        ¿No tienes cuenta? 
                        <a href="{{ url_for('auth.registro') }}" style="font-weight: 600;">Regístrate aquí</a>
                    </p>
                </div>
            </div>
            
            <div class="text-center mt-lg">
                <p class="text-muted" style="font-size: 0.9rem;">
                    <strong>Prueba:</strong><br>
                    Usuario: <code>admin</code> | Contraseña: <code>password123</code>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
