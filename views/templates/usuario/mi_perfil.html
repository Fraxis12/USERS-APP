{% extends "base.html" %}

{% block title %}Mi Perfil{% endblock %}

{% block content %}
<div class="container-md" style="padding: var(--spacing-xl) 0;">
    <div class="mb-lg">
        <a href="{{ url_for('main.dashboard') }}" style="color: var(--primary-color);">← Dashboard</a>
        <h1>Mi Perfil</h1>
    </div>
    
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Información Personal</h3>
        </div>
        <div class="card-body">
            <form id="formPerfil">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        value="{{ usuario.nombre }}"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        value="{{ usuario.email }}"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario" 
                        value="{{ usuario.usuario }}"
                        required
                    >
                </div>
                
                <hr style="margin: var(--spacing-lg) 0; border: none; border-top: 1px solid var(--border-color);">
                
                <h3 style="margin-bottom: var(--spacing-lg);">Cambiar Contraseña</h3>
                
                <div class="form-group">
                    <label for="contraseña">Nueva Contraseña</label>
                    <input 
                        type="password" 
                        id="contraseña" 
                        name="contraseña" 
                        placeholder="Déjalo vacío si no deseas cambiar"
                    >
                    <span class="form-text">Mínimo 6 caracteres (opcional)</span>
                </div>
                
                <div class="flex gap-md" style="margin-top: var(--spacing-xl);">
                    <button 
                        type="button" 
                        class="btn btn-primary"
                        onclick="enviarFormularioAJAX(
                            document.getElementById('formPerfil'),
                            '{{ url_for('usuario.actualizar_perfil') }}',
                            '{{ url_for('main.dashboard') }}'
                        )"
                    >
                        Guardar Cambios
                    </button>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
    
    <div class="card mt-lg" style="border-color: var(--border-light);">
        <div class="card-header" style="background-color: #fee2e2;">
            <h3 class="card-title" style="color: #991b1b;">⚠️ Zona de Peligro</h3>
        </div>
        <div class="card-body">
            <p class="text-muted mb-lg">
                Las acciones aquí son permanentes y no pueden deshacerse.
            </p>
            <button 
                class="btn btn-danger"
                onclick="confirmarEliminacion('Esta acción no puede deshacerse. ¿Deseas continuar?') && alert('Contacta a un administrador para eliminar tu cuenta')"
            >
                Eliminar Mi Cuenta
            </button>
        </div>
    </div>
</div>
{% endblock %}
