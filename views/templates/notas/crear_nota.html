{% extends "base.html" %}

{% block title %}Crear Nota{% endblock %}

{% block content %}
<div class="container-md" style="padding: var(--spacing-xl) 0;">
    <div class="mb-lg">
        <a href="{{ url_for('nota.mis_notas') }}" style="color: var(--primary-color);">← Mis Notas</a>
        <h1>Nueva Nota</h1>
    </div>
    
    <div class="card">
        <div class="card-body">
            {% if errores %}
            <div class="alert alert-danger">
                <strong>Errores:</strong>
                <ul style="margin: 0.5rem 0 0 0; padding-left: 1.5rem;">
                    {% for error in errores %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('nota.crear_nota') }}">
                <div class="form-group">
                    <label for="titulo">Título</label>
                    <input 
                        type="text" 
                        id="titulo" 
                        name="titulo" 
                        placeholder="Título de la nota"
                        required
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="contenido">Contenido</label>
                    <textarea 
                        id="contenido" 
                        name="contenido" 
                        placeholder="Escribe el contenido de tu nota aquí..."
                        required
                        style="min-height: 300px;"
                    ></textarea>
                </div>
                
                <div class="flex gap-md" style="margin-top: var(--spacing-xl);">
                    <button type="submit" class="btn btn-success">
                        Crear Nota
                    </button>
                    <a href="{{ url_for('nota.mis_notas') }}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
