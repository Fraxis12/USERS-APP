{% extends "base.html" %}

{% block title %}Crear Usuario{% endblock %}

{% block content %}
<div class="container-md" style="padding: var(--spacing-xl) 0;">
    <div class="mb-lg">
        <a href="{{ url_for('usuario.panel_admin') }}" style="color: var(--primary-color);">← Panel Admin</a>
        <h1>Crear Nuevo Usuario</h1>
    </div>
    
    <div class="card">
        <div class="card-body">
            {% if errores %}
            <div class="alert alert-danger">
                <strong>Errores:</strong>
                <ul style="margin: 0.5rem 0 0 0; padding-left: 1.5rem;">
                    {% for error in errores %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
                <button class="alert-close" onclick="this.parentElement.remove()">×</button>
            </div>
            {% endif %}
            
            <form method="POST" action="{{ url_for('usuario.crear_usuario') }}">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input 
                        type="text" 
                        id="nombre" 
                        name="nombre" 
                        placeholder="Nombre del usuario"
                        required
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="correo@ejemplo.com"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input 
                        type="text" 
                        id="usuario" 
                        name="usuario" 
                        placeholder="usuario_nombre"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="contraseña">Contraseña</label>
                    <input 
                        type="password" 
                        id="contraseña" 
                        name="contraseña" 
                        placeholder="Contraseña (mínimo 6 caracteres)"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="usuario">Usuario Regular</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                
                <div class="flex gap-md" style="margin-top: var(--spacing-xl);">
                    <button type="submit" class="btn btn-success">
                        Crear Usuario
                    </button>
                    <a href="{{ url_for('usuario.panel_admin') }}" class="btn btn-secondary">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
